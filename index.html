<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comprobación del sistema</title>

<style>
body {
    background: #050505;
    color: #00ff66;
    font-family: monospace;
    text-align: center;
    padding-top: 25vh;
}

#texto {
    font-size: 22px;
    padding: 20px;
}

.barra {
    width: 80%;
    height: 8px;
    border: 1px solid #00ff66;
    margin: 25px auto;
}

.progreso {
    height: 100%;
    width: 0%;
    background: #00ff66;
    transition: width 0.5s;
}
</style>
</head>

<body>

<div id="texto">Iniciando diagnóstico...</div>

<div class="barra">
    <div class="progreso" id="progreso"></div>
</div>

<script>

const mensajes = [
    "Conectando con el dispositivo...",
    "Verificando conexión...",
    "Analizando ubicación...",
    "Obteniendo coordenadas...",
    "Comprobando dispositivo...",
    "Dispositivo localizado.",
    "Preparando informe..."
];

let i = 0;

function siguiente() {

    document.getElementById("texto").textContent = mensajes[i];

    document.getElementById("progreso").style.width =
        ((i + 1) / mensajes.length * 100) + "%";

    i++;

    if (i < mensajes.length) {
        setTimeout(siguiente, 1800);
    } else {
        setTimeout(() => {
            document.getElementById("texto").innerHTML =
                "💀 TE LA CREÍSTE JAJAJA<br><br>NO SE ESTÁ RASTREANDO NADA";
        }, 2000);
    }
}

siguiente();

</script>

</body>
</html>
